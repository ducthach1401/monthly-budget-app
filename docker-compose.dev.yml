services:
  app:
    image: node:20-alpine
    command: 'sh -c "corepack enable && yarn install && yarn start:dev"'
    restart: unless-stopped
    ports:
      - '${APP_PORT}:${APP_PORT}'
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      PORT: ${APP_PORT}
    env_file:
      - .env
    depends_on:
      - ollama
      - mysql
    volumes:
      - .:/app
    working_dir: /app

  ollama:
    image: ollama/ollama:0.20.3
    entrypoint: ['/bin/sh', '-c']
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    command:
      - 'ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull "$$OLLAMA_MODEL"; wait'
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT}:11434'
    volumes:
      - ollama_data_dev:/root/.ollama

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # ports:
    #   - '${DB_PORT}:3306'
    volumes:
      - mysql_data_dev:/var/lib/mysql
    restart: unless-stopped

volumes:
  ollama_data_dev:
  mysql_data_dev:
