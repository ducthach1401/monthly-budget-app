services:
  app:
    image: node:20-alpine
    command: 'sh -c "corepack enable && yarn install && yarn start:dev"'
    restart: unless-stopped
    ports:
      - '${APP_PORT}:${APP_PORT}'
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      PORT: ${APP_PORT}
    env_file:
      - .env
    depends_on:
      - mysql
    volumes:
      - .:/app
    working_dir: /app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # ports:
    #   - '${DB_PORT}:3306'
    volumes:
      - mysql_data_dev:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data_dev:
