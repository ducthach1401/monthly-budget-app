<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat - Ollama</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #16213e;
      padding: 16px 24px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; color: #e94560; }
    #model-select {
      background: #0f3460;
      color: #eee;
      border: 1px solid #e94560;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
      border-bottom-left-radius: 4px;
    }
    .message.typing {
      opacity: 0.7;
      font-style: italic;
    }
    #input-area {
      background: #16213e;
      padding: 16px 24px;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 12px;
    }
    #message-input {
      flex: 1;
      background: #0f3460;
      border: 1px solid #e94560;
      color: #eee;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }
    #message-input::placeholder { color: #888; }
    #send-btn {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 0 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { text-align: center; color: #888; font-size: 0.85rem; padding: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI Chat</h1>
    <select id="model-select">
      <option value="">Loading models...</option>
    </select>
  </header>

  <div id="chat-container">
    <div class="status">Chào mừng! Nhập tin nhắn để bắt đầu trò chuyện với AI.</div>
  </div>

  <div id="input-area">
    <textarea id="message-input" placeholder="Nhập tin nhắn..." rows="1"></textarea>
    <button id="send-btn">Gửi</button>
  </div>

  <script>
    const API_URL = window.location.origin;
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const modelSelect = document.getElementById('model-select');
    let history = [];
    let isStreaming = false;

    // Load available models
    async function loadModels() {
      try {
        const res = await fetch(`${API_URL}/chat/models`);
        const data = await res.json();
        modelSelect.innerHTML = '';
        if (data.success && data.data.models) {
          data.data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = m.name;
            modelSelect.appendChild(opt);
          });
        }
      } catch (e) {
        modelSelect.innerHTML = '<option value="llama3.2">llama3.2 (default)</option>';
      }
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      messageInput.value = '';

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      const assistantDiv = addMessage('assistant', '');
      assistantDiv.classList.add('typing');

      try {
        const res = await fetch(`${API_URL}/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            model: modelSelect.value || undefined,
            history: history.slice(0, -1),
          }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const data = JSON.parse(line.slice(6));
                fullContent += data.content;
                assistantDiv.textContent = fullContent;
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } catch (e) {}
            }
          }
        }

        assistantDiv.classList.remove('typing');
        history.push({ role: 'assistant', content: fullContent });
      } catch (error) {
        assistantDiv.textContent = `Lỗi: ${error.message}. Hãy chắc chắn Ollama đang chạy.`;
        assistantDiv.classList.remove('typing');
      }

      isStreaming = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    loadModels();
    messageInput.focus();
  </script>
</body>
</html>
